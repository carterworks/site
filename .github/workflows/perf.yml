name: Performance

on:
  pull_request:
    paths:
      - src/**
      - scripts/perf.mjs
      - scripts/play-page.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/perf.yml

env:
  CI: true

jobs:
  perf:
    runs-on: ubuntu-latest
    name: Performance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: Build the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../base "$BASE"
          pnpm --dir ../base install --frozen-lockfile
          pnpm --dir ../base build
      - name: Build this branch
        run: pnpm build
      - name: Compare this branch against its base
        run: |
          {
            echo '```'
            node scripts/perf.mjs --against ../base/dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
