<!doctype html>
<!--
  The fixed workload `scripts/budget-check.mjs` divides each frame cost by. It
  stands in for the backdrop: a 160x160 canvas redrawn by a per-pixel loop
  every frame, enlarged to fill the viewport, under a translucent
  full-viewport layer. Not a blended one: a blend's cost grows under load
  faster than the Site display's does, while a plain layer's grows about as
  fast as every display's, or faster, so load can only lower a ratio.

  It must never change: every frame cost limit in `scripts/budgets.mjs` is a
  multiple of what it costs, so editing it means resetting them all.
-->
<meta charset="utf-8" />
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: #fff;
  }
  canvas,
  div {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    image-rendering: pixelated;
  }
  div {
    background: linear-gradient(135deg, #fff, #c9d6a3);
    opacity: 0.5;
  }
</style>
<canvas
  width="160"
  height="160"
></canvas>
<div></div>
<script>
  const SIZE = 160;
  const context = document.querySelector("canvas").getContext("2d");
  const image = context.createImageData(SIZE, SIZE);
  const pixels = image.data;
  const previous = new Float32Array(SIZE * SIZE);
  // Nothing is allocated per frame, so garbage collection adds no jitter.
  const dotX = new Float64Array(12);
  const dotY = new Float64Array(12);
  let frame = 0;
  const draw = () => {
    frame += 1;
    for (let dot = 0; dot < 12; dot += 1) {
      const angle = frame * 0.02 * (dot + 1);
      dotX[dot] = 80 + 60 * Math.cos(angle);
      dotY[dot] = 80 + 60 * Math.sin(angle * 1.3);
    }
    for (let y = 0; y < SIZE; y += 1) {
      for (let x = 0; x < SIZE; x += 1) {
        let glow = 0;
        for (let dot = 0; dot < 12; dot += 1) {
          const dx = x - dotX[dot];
          const dy = y - dotY[dot];
          glow += 40 / (dx * dx + dy * dy + 40);
        }
        const index = y * SIZE + x;
        const level = (previous[index] =
          previous[index] * 0.8 + Math.min(1, glow) * 0.2);
        pixels[index * 4] = 255 * level;
        pixels[index * 4 + 1] = 160 * level;
        pixels[index * 4 + 2] = 90;
        pixels[index * 4 + 3] = 255;
      }
    }
    context.putImageData(image, 0, 0);
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
</script>
